version: "3.9"
services:
  my-redis:
    image: redis:latest
    container_name: my-redis
    hostname: redis-server
    networks:
      - testNet
    ports:
      - "6379:6379"
    restart: unless-stopped
    environment:
      SKIP_FIX_PERMS: "1"
    volumes:
      - testVol:/data

volumes:
  testVol:
    external: true

networks:
  testNet:
    external: true
