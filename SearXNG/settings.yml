# SearXNG Configuration
# Reference: https://docs.searxng.org/admin/settings/settings.html

use_default_settings: true

general:
  debug: false
  instance_name: "SearXNG"

server:
  # Secret key used for cryptography / session signing
  secret_key: "searxng_local_secret_key_change_in_production"
  limiter: false
  image_proxy: true

search:
  safe_search: 0
  autocomplete: "duckduckgo"
  formats:
    - html
    - json
