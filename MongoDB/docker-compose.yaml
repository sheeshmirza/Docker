version: "3.9"
services:
  my-mongo:
    image: mongo:latest
    container_name: my-mongo
    hostname: mongo-server
    networks:
      - testNet
    ports:
      - "27017:27017"
    restart: unless-stopped
    #command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - testVol:/data/db

volumes:
  testVol:

networks:
  testNet:
