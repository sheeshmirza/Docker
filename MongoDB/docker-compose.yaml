version: "3.9"
services:
  my-mongo:
    image: mongo:latest
    container_name: my-mongo
    hostname: mongo-server
    networks:
      - testNet
    ports:
      - "27017:27017"
    restart: unless-stopped
    volumes:
      - testVol:/data/db

volumes:
  testVol:
    external: true

networks:
  testNet:
    external: true
