version: "3.9"
services:
  my-n8n:
    image: n8nio/n8n:latest
    container_name: my-n8n
    hostname: n8n-server
    networks:
      - testNet
    ports:
      - "5678:5678"
    restart: unless-stopped
    user: root
    environment:
      N8N_USER_FOLDER: /home/node/.n8n/n8n_data
    volumes:
      - testVol:/home/node/.n8n

volumes:
  testVol:
    external: true

networks:
  testNet:
    external: true
