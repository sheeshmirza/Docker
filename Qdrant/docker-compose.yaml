version: "3.9"
services:
  my-qdrant:
    image: qdrant/qdrant:latest
    container_name: my-qdrant
    hostname: qdrant-server
    networks:
      - testNet
    ports:
      - "6333:6333"
      - "6334:6334"
    restart: unless-stopped
    volumes:
      - testVol:/qdrant/storage

volumes:
  testVol:

networks:
  testNet: